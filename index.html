<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional teleprompter for educators, trainers & speakers. Record video with 100% accurate captions embedded — no AI transcription errors, ever."
    />
    <title>SpeakScroll — Teleprompter with Perfect Video Captions</title>

    <!-- Open Graph -->
    <meta property="og:title" content="SpeakScroll — Teleprompter with Perfect Video Captions" />
    <meta property="og:description" content="Professional teleprompter for educators, trainers & speakers. Record video with 100% accurate captions embedded." />
    <meta property="og:image" content="https://speakscroll.com/og-image.png" />
    <meta property="og:url" content="https://speakscroll.com" />
    <meta property="og:type" content="website" />

    <!-- Structured data: software application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SpeakScroll",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "Professional teleprompter with script-based video caption embedding for educators, trainers, and speakers.",
        "url": "https://speakscroll.com",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Starter",
            "price": "7.99",
            "priceCurrency": "USD",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            }
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "14.99",
            "priceCurrency": "USD",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            }
          }
        ]
      }
    </script>

    <!-- Structured data: homepage FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What makes SpeakScroll different from other teleprompter apps?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SpeakScroll embeds your actual script as video captions — not AI-generated captions. Since you wrote the script, the captions are 100% accurate, with zero transcription errors."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to install anything?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. SpeakScroll works entirely in your web browser — no app download required."
            }
          },
          {
            "@type": "Question",
            "name": "What's included in the free plan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Unlimited teleprompter practice, camera preview, and full reading controls. Video recording requires a Starter or Pro subscription."
            }
          },
          {
            "@type": "Question",
            "name": "How does the 14-day free trial work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When you subscribe to Starter or Pro, you get 14 days of full access before any charge. Cancel anytime during the trial with no cost."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use SpeakScroll for YouTube or TikTok videos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. SpeakScroll works for any platform — YouTube, TikTok, Instagram, LinkedIn, or internal training videos."
            }
          },
          {
            "@type": "Question",
            "name": "What's the difference between Starter and Pro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Starter includes unlimited recording, script-based captions, and basic green screen. Pro adds speech-to-text caption sync, advanced green screen with custom backgrounds, video filters, multiple takes, and one-click social export."
            }
          },
          {
            "@type": "Question",
            "name": "Is my script or video data private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Your scripts and recordings are private to your account. See our Privacy Policy for full details."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
